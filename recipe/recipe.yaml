context:
  version: 1.109.0

package:
  name: litellm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/litellm/litellm-${{ version }}.tar.gz
  sha256: 267639caedf188b4b9417132c3778ec322e774f8a24b836d12d8843e5b2d5e14

build:
  skip: match(python, '<3.11') or match(python, '>=3.16')
  script:
    - cd litellm-rust
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cd ..
    - python -m pip install . -vv
  number: 0
  python:
    entry_points:
      - litellm = litellm:run_server

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin ==1.15.0
        - pip
  host:
    - maturin ==1.15.0
    - pip
    - puccinialin
    - python
  run:
    - python
    - if: match(python, '<3.15')
      then: fastuuid >=0.14.0,<1.0
    - filelock >=3.16.1,<5.0
    - httpx >=0.28.0,<1.0
    - openai >=2.20.0,<4.0.0
    - python-dotenv >=1.0.0,<2.0
    - pyyaml >=6.0.3,<7.0
    - packaging >=24.0
    - importlib-metadata >=8.0.0,<9.0
    - if: match(python, '<3.14')
      then: tiktoken >=0.8.0,<1.0
    - if: match(python, '==3.14')
      then: tiktoken >=0.12.0,<1.0
    - if: match(python, '>=3.15')
      then: tiktoken >=0.14.0,<1.0
    - tokenizers >=0.21.0,<1.0
    - huggingface_hub >=0.34.0,<2.0
    - click >=8.0.0,<9.0
    - jinja2 >=3.1.6,<4.0
    - aiohttp >=3.14.2,<4.0
    - anyio >=4.14.0,<5.0
    - if: match(python, '<3.11')
      then: async-timeout >=4.0.3,<6.0
    - if: match('python', '<3.14')
      then: pydantic >=2.11.0,<3.0.0
    - if: match(python, '==3.14')
      then: pydantic >=2.12.0,<3.0.0
    - if: match(python, '>=3.15')
      then: pydantic >=2.14.0,<3.0.0
    - pydantic-settings >=2.14.1,<3.0
    - jsonschema >=4.0.0,<5.0
    - boto3 >=1.43.117,<2.0
    - certifi >=2026.10.19
    - typing_extensions >=4.13.0,<5.0
tests:
  - python:
      imports: litellm
      pip_check: true
  - script: litellm --help

about:
  homepage: https://www.litellm.ai
  summary: Library to easily interface with LLM API providers
  license: MIT
  license_file:
    - LICENSE
    - litellm-rust/THIRDPARTY.yml
  documentation: https://docs.litellm.ai
  repository: https://github.com/BerriAI/litellm

extra:
  recipe-maintainers:
    - m-rossi
    - jan-janssen
